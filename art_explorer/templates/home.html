<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Explorer</title>
</head>
<body>
    <h1>Art Explorer</h1>

    <p>Explore artwork from the Art Institute of Chicago.</p>

    <form action="/results" method="get">
        <label for="search">Search for an artist or artwork:</label>
        <input type="text" id="search" name="search">
        <button type="submit">Search</button>
    </form>
</body>
</html>
